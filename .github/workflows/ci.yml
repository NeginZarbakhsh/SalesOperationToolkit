name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the tests
        run: pytest -q
      - name: Run the full diagnostic end to end
        run: python forecast_diagnostic.py --no-ai
      - name: Run the same code for the second customer (different CRM, config only)
        run: python forecast_diagnostic.py --config customers/acme_hubspot.json --no-ai
      - name: Upload the generated outputs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-outputs
          path: outputs/
